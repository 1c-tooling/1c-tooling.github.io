    <main>
      <h1>Установка eska</h1>
      <h2>Linux и macOS</h2>
      <pre><code>curl --proto '=https' --tlsv1.2 -LsSf https://1c-tooling.github.io/eska/install | sh</code></pre>
      <h2>Windows PowerShell</h2>
      <pre><code>powershell -ExecutionPolicy Bypass -c "irm https://1c-tooling.github.io/eska/install.ps1 | iex"</code></pre>
    </main>
  </body>
